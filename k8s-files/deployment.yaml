apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-website
  namespace: bank-app
  labels:
    app: bank-website
spec:
  replicas: 4
  selector:
    matchLabels:
      app: bank-website
  template:
    metadata:
      labels:
        app: bank-website
    spec:
      containers:
      - name: bank-website
        image: krushjagdale/bank-website-clone:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
