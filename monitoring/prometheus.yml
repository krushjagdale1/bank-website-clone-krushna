global:
  scrape_interval: 15s
rule_files:
  - "/etc/prometheus/alert.yaml"

scrape_configs:

  - job_name: 'kubernetes-nodes'
    static_configs:
      - targets:
          - '172.31.17.103:9100'  #give here k8s master private ip 
          - '172.31.28.81:9100'  #give here k8s worker1 private ip
          - '172.31.19.41:9100'   #give here k8s worker2 private ip

  - job_name: 'kube-state-metrics'
    static_configs:
      - targets:
          - '172.31.17.103:31196'  #kube-state-matric private IP 

  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - '172.31.17.103:8080'
          - '172.31.28.81:8080'
          - '172.31.19.41:8080'
